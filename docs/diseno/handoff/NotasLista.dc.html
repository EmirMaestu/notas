<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;color:var(--fg);font-size:14px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
  <sc-if value="{{ g.label }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:baseline;gap:8px;padding:20px 14px 8px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{ g.color }}">{{ g.label }}</span>
      <span style="font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums">{{ g.count }}</span>
    </div>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:2px">
  <sc-for list="{{ g.tasks }}" as="t" hint-placeholder-count="3">
    <div data-task-row="" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:9px 14px;border-radius:10px;background:{{ t.bg }};box-shadow:{{ t.ring }};cursor:default;opacity:{{ t.opacity }};transition:background .12s" style-hover="background:var(--hover)">
      <sc-if value="{{ t.restore }}" hint-placeholder-val="{{ false }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin:0 1px"><use href="#i-trash"></use></svg>
      </sc-if>
      <sc-if value="{{ t.checkbox }}" hint-placeholder-val="{{ true }}">
        <span role="checkbox" aria-checked="{{ t.done }}" style="width:20px;height:20px;border-radius:50%;border:2px solid {{ t.pColor }};background:{{ t.cbBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box;transition:background .2s,border-color .2s">
          <sc-if value="{{ t.done }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent-fg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"></use></svg></sc-if>
        </span>
      </sc-if>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <span style="font-weight:500;color:{{ t.titleColor }};text-decoration:{{ t.deco }};text-decoration-color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.title }}</span>
          <sc-if value="{{ t.ai }}" hint-placeholder-val="{{ false }}"><svg aria-label="Creada por IA" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.9"><use href="#i-sparkles"></use></svg></sc-if>
          <sc-if value="{{ t.sub }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-list"></use></svg>{{ t.sub }}</span></sc-if>
        </div>
        <sc-if value="{{ t.meta }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0">
            <sc-if value="{{ t.list }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:{{ t.listDot }}"></span>{{ t.list }}</span></sc-if>
            <sc-for list="{{ t.tags }}" as="tag" hint-placeholder-count="0"><span style="padding:1px 6px;border-radius:5px;background:var(--hover);font-weight:500">#{{ tag }}</span></sc-for>
            <sc-if value="{{ t.note }}" hint-placeholder-val="{{ false }}"><span>{{ t.note }}</span></sc-if>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ t.date }}" hint-placeholder-val="{{ false }}">
        <span style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:{{ t.dateColor }};white-space:nowrap;flex-shrink:0">
          <sc-if value="{{ t.overdue }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-alert"></use></svg></sc-if>
          {{ t.date }}
        </span>
      </sc-if>
      <sc-if value="{{ t.who }}" hint-placeholder-val="{{ false }}">
        <span aria-label="{{ t.whoName }}" style="width:24px;height:24px;border-radius:50%;background:{{ t.whoBg }};color:var(--av-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{ t.who }}</span>
      </sc-if>
      <sc-if value="{{ t.restore }}" hint-placeholder-val="{{ false }}">
        <span style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--fg);flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-rotate"></use></svg>Restaurar</span>
      </sc-if>
    </div>
  </sc-for>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:400},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Group[]&quot;}}"></script>
</body>
</html>
