<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Navegación principal" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:14px 12px 12px;background:var(--sidebar);color:var(--fg);font-size:14px;overflow:hidden">
  <div style="display:flex;align-items:center;gap:9px;padding:2px 10px 12px">
    <div style="width:22px;height:22px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent-fg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"></use></svg></div>
    <span style="font-weight:800;font-size:15px;letter-spacing:-0.02em">Notas</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ smart }}" as="it" hint-placeholder-count="6">
      <a href="#" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;text-decoration:none;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }}" style-hover="background:var(--hover)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.85;flex-shrink:0"><use href="#i-{{ it.icon }}"></use></svg>
        <span style="flex:1">{{ it.label }}</span>
        <sc-if value="{{ it.count }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500">{{ it.count }}</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px">
    <span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Listas</span>
    <svg aria-label="Nueva lista" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-plus"></use></svg>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;color:var(--muted)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron-down"></use></svg>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-folder"></use></svg>
      <span style="color:var(--fg);font-weight:500">Personal</span>
    </div>
    <sc-for list="{{ lists }}" as="it" hint-placeholder-count="4">
      <a href="#" style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;margin-left:{{ it.indent }};border-radius:8px;text-decoration:none;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }}" style-hover="background:var(--hover)">
        <span style="width:9px;height:9px;border-radius:50%;background:{{ it.dot }};flex-shrink:0;margin:0 3.5px"></span>
        <span style="flex:1">{{ it.label }}</span>
        <sc-if value="{{ it.shared }}" hint-placeholder-val="{{ false }}"><svg aria-label="compartida" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-users"></use></svg></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="padding:14px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Compartidas conmigo</div>
  <a href="#" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--fg)" style-hover="background:var(--hover)">
    <span style="width:9px;height:9px;border-radius:50%;background:#C2559A;flex-shrink:0;margin:0 3.5px"></span>
    <span style="flex:1">Viaje a Mendoza</span>
    <span style="width:18px;height:18px;border-radius:50%;background:var(--av-sofia);color:var(--av-fg);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">S</span>
  </a>

  <div style="padding:14px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Etiquetas</div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ tags }}" as="it" hint-placeholder-count="4">
      <a href="#" style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:8px;text-decoration:none;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }}" style-hover="background:var(--hover)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 .5px"><use href="#i-hash"></use></svg>
        <span>{{ it.label }}</span>
      </a>
    </sc-for>
  </div>

  <div style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px">
    <a href="#" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;text-decoration:none;background:{{ settingsBg }};color:{{ settingsColor }};font-weight:{{ settingsWeight }}" style-hover="background:var(--hover)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.85"><use href="#i-settings"></use></svg>
      <span>Configuración</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px 2px">
      <span style="width:22px;height:22px;border-radius:50%;background:var(--av-emir);color:var(--av-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">E</span>
      <span style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">emir@notas.app</span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;inbox&quot;,&quot;today&quot;,&quot;next7&quot;,&quot;assigned&quot;,&quot;completed&quot;,&quot;trash&quot;,&quot;list-casa&quot;,&quot;list-trabajo&quot;,&quot;list-compras&quot;,&quot;list-facultad&quot;,&quot;tag-casa&quot;,&quot;settings&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const st = (id) => {
      const on = id === active;
      return { bg: on ? 'var(--selected)' : 'transparent', color: on ? 'var(--accent)' : 'var(--fg)', weight: on ? 600 : 500 };
    };
    const smart = [
      { id: 'inbox', icon: 'inbox', label: 'Bandeja', count: 3 },
      { id: 'today', icon: 'sun', label: 'Hoy', count: 5 },
      { id: 'next7', icon: 'calendar-days', label: 'Próximos 7 días', count: 0 },
      { id: 'assigned', icon: 'user-check', label: 'Asignadas a mí', count: 0 },
      { id: 'completed', icon: 'check-circle', label: 'Completadas', count: 0 },
      { id: 'trash', icon: 'trash', label: 'Papelera', count: 0 },
    ].map((i) => ({ ...i, ...st(i.id) }));
    const lists = [
      { id: 'list-facultad', label: 'Facultad', dot: '#7A5AD6', indent: '22px', shared: false },
      { id: 'list-casa', label: 'Casa', dot: '#2F8F5B', indent: '0', shared: false },
      { id: 'list-trabajo', label: 'Trabajo', dot: '#2F6FD6', indent: '0', shared: true },
      { id: 'list-compras', label: 'Compras', dot: '#D08A1A', indent: '0', shared: true },
    ].map((i) => ({ ...i, ...st(i.id) }));
    const tags = ['casa', 'urgente', 'llamadas', 'finde'].map((t) => ({ id: 'tag-' + t, label: t, ...st('tag-' + t) }));
    const s = st('settings');
    return { smart, lists, tags, settingsBg: s.bg, settingsColor: s.color, settingsWeight: s.weight };
  }
}
</script>
</body>
</html>
