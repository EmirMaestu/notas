# Verificación de cada PR (y de master después del merge). Es un chequeo obligatorio para mergear a master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Un PR nuevo cancela la corrida anterior del mismo PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Verificación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Igual que la imagen de producción (Dockerfile: node:24-bookworm-slim).
          node-version: 24
          cache: npm

      # Si falla acá, el lockfile no instala en Linux (ver docs/PROGRESO.md): el deploy también fallaría.
      - run: npm ci --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest + PGlite)
        run: npm test

      - name: Build de producción
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verificar
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
